<!doctype html>
<html lang="ru">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <title>Экран</title>
    <style>
      * {
        box-sizing: border-box;
      }

      html,
      body {
        margin: 0;
        width: 100%;
        height: 100%;
        overflow: hidden;
        font-family: Arial, Helvetica, sans-serif;
        background: #ffffff;
      }

      #screen {
        position: fixed;
        inset: 0;
        display: grid;
        place-items: center;
        background: #ffffff;
        color: #111111;
        text-align: center;
      }

      #mainText {
        padding: 6vw;
        font-size: clamp(44px, 12vw, 150px);
        font-weight: 900;
        line-height: 1.05;
        overflow-wrap: anywhere;
        white-space: pre-wrap;
      }

      #debug {
        position: fixed;
        left: 10px;
        right: 10px;
        bottom: 10px;
        z-index: 10;
        padding: 10px 12px;
        border-radius: 8px;
        background: rgba(0, 0, 0, 0.72);
        color: #ffffff;
        font-size: 14px;
        text-align: left;
        word-break: break-word;
      }

      img,
      video {
        width: 100%;
        height: 100%;
        object-fit: contain;
        background: #000000;
      }
    </style>
  </head>
  <body>
    <main id="screen">
      <div id="mainText">ЭКРАН РАБОТАЕТ</div>
    </main>
    <div id="debug">Запуск экрана...</div>

    <script>
      const URL = "https://hhh3-635eb-default-rtdb.europe-west1.firebasedatabase.app/statusScreen/current.json";
      const screen = document.querySelector("#screen");
      let mainText = document.querySelector("#mainText");
      const debug = document.querySelector("#debug");

      const words = {
        green: "не занят",
        red: "занят",
        yellow: "занят, но не сильно",
      };

      let last = "";

      showStartup();
      readNow();
      setInterval(readNow, 700);

      function showStartup() {
        ensureTextLayer();
        screen.style.background = "#ffffff";
        screen.style.color = "#111111";
        mainText.textContent = "ЭКРАН РАБОТАЕТ";
        debug.textContent = "Файл экрана загрузился. Жду данные Firebase...";
      }

      async function readNow() {
        try {
          const response = await fetch(URL + "?t=" + Date.now(), { cache: "no-store" });
          if (!response.ok) throw new Error("HTTP " + response.status);
          const data = await response.json();
          const text = JSON.stringify(data || {});
          debug.textContent = "Firebase OK: " + text;
          if (text === last) return;
          last = text;
          render(data || {});
        } catch (error) {
          screen.style.background = "#ffffff";
          screen.style.color = "#c52020";
          mainText.textContent = "НЕТ СВЯЗИ";
          debug.textContent = "Ошибка чтения Firebase: " + error.message;
        }
      }

      function render(state) {
        const type = state.type || "blank";

        if (type === "color") {
          ensureTextLayer();
          if (state.color === "green") {
            screen.style.background = "#19c15f";
            screen.style.color = "#ffffff";
          } else if (state.color === "yellow") {
            screen.style.background = "#ffd333";
            screen.style.color = "#111111";
          } else if (state.color === "red") {
            screen.style.background = "#ef3939";
            screen.style.color = "#ffffff";
          } else {
            screen.style.background = "#ffffff";
            screen.style.color = "#111111";
          }

          mainText.textContent = state.showWords ? words[state.color] || "" : "";
          return;
        }

        if (type === "text") {
          ensureTextLayer();
          screen.style.background = "#ffffff";
          screen.style.color = "#111111";
          mainText.textContent = state.customText || "";
          return;
        }

        if (type === "image" && state.media && state.media.dataUrl) {
          screen.innerHTML = '<img src="' + state.media.dataUrl + '" alt="">';
          return;
        }

        if (type === "video" && state.media && state.media.dataUrl) {
          screen.innerHTML = '<video src="' + state.media.dataUrl + '" autoplay loop muted playsinline controls></video>';
          return;
        }

        screen.style.background = "#ffffff";
        screen.style.color = "#111111";
        ensureTextLayer();
        mainText.textContent = "";
      }

      function ensureTextLayer() {
        if (document.querySelector("#mainText")) {
          mainText = document.querySelector("#mainText");
          return;
        }
        screen.innerHTML = '<div id="mainText"></div>';
        mainText = document.querySelector("#mainText");
      }
    </script>
  </body>
</html>
