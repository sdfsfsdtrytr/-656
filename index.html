<!doctype html>
<html lang="ru">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <title>Экран статуса</title>
    <link rel="stylesheet" href="styles.css">
  </head>
  <body class="screen-page">
    <section class="status-screen">
      <div id="rotator" class="rotator landscape">
        <div id="greeting" class="greeting">Приветствую</div>
        <div id="content" class="screen-content blank"></div>
      </div>
    </section>

    <script>
      const STATE_URL = "https://hhh3-635eb-default-rtdb.europe-west1.firebasedatabase.app/statusScreen/current.json";
      const rotator = document.querySelector("#rotator");
      const greeting = document.querySelector("#greeting");
      const content = document.querySelector("#content");

      const defaultState = {
        type: "blank",
        color: null,
        showWords: false,
        customText: "",
        media: null,
        orientation: "landscape",
        updatedAt: 0,
      };

      const labels = {
        green: "не занят",
        red: "занят",
        yellow: "занят, но не сильно",
      };

      let lastStateText = "";

      setTimeout(() => {
        greeting.hidden = true;
      }, 1800);

      readState();
      setInterval(readState, 500);

      async function readState() {
        try {
          const response = await fetch(`${STATE_URL}?t=${Date.now()}`, { cache: "no-store" });
          if (!response.ok) throw new Error(`HTTP ${response.status}`);
          const data = await response.json();

          if (!data) {
            render(defaultState);
            return;
          }

          const stateText = JSON.stringify(data);
          if (stateText === lastStateText) return;
          lastStateText = stateText;
          render({ ...defaultState, ...data });
        } catch (error) {
          content.className = "screen-content disconnected";
          content.textContent = "нет связи";
        }
      }

      function render(state) {
        rotator.className = `rotator ${state.orientation || "landscape"}`;

        if (state.type === "color") {
          content.className = `screen-content color ${state.color || "green"}`;
          content.innerHTML = state.showWords ? `<span>${labels[state.color] || ""}</span>` : "";
          return;
        }

        if (state.type === "text") {
          content.className = "screen-content text-mode";
          content.textContent = state.customText || "";
          return;
        }

        if (state.type === "image" && state.media && state.media.dataUrl) {
          content.className = "screen-content media-mode";
          content.innerHTML = `<img src="${state.media.dataUrl}" alt="">`;
          return;
        }

        if (state.type === "video" && state.media && state.media.dataUrl) {
          content.className = "screen-content media-mode";
          content.innerHTML = `<video src="${state.media.dataUrl}" autoplay loop muted playsinline controls></video>`;
          return;
        }

        content.className = "screen-content blank";
        content.innerHTML = "";
      }
    </script>
  </body>
</html>
