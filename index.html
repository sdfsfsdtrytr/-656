<!doctype html>
<html lang="ru">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <title>Экран статуса</title>
    <link rel="stylesheet" href="styles.css">
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%23101318'/%3E%3Ccircle cx='32' cy='32' r='18' fill='%2329d36b'/%3E%3C/svg%3E">
  </head>
  <body class="screen-page">
    <section id="screen" class="status-screen">
      <div id="rotator" class="rotator landscape">
        <div id="greeting" class="greeting">Приветствую</div>
        <div id="content" class="screen-content blank"></div>
      </div>
    </section>

    <script src="https://www.gstatic.com/firebasejs/10.13.2/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.13.2/firebase-database-compat.js"></script>
    <script src="./app-config.js"></script>
    <script>
      const rotator = document.querySelector("#rotator");
      const greeting = document.querySelector("#greeting");
      const content = document.querySelector("#content");

      const defaultState = {
        type: "blank",
        color: null,
        showWords: false,
        customText: "",
        media: null,
        orientation: "landscape",
      };

      const labels = {
        green: "не занят",
        red: "занят",
        yellow: "занят, но не сильно",
      };

      const colorClass = {
        green: "green",
        red: "red",
        yellow: "yellow",
      };

      setTimeout(() => {
        greeting.hidden = true;
      }, 2200);

      try {
        firebase.initializeApp(window.firebaseConfig);
        const stateRef = firebase.database().ref(window.databasePath);

        stateRef.on("value", (snapshot) => {
          if (!snapshot.exists()) {
            stateRef.set({ ...defaultState, updatedAt: Date.now() });
            render(defaultState);
            return;
          }
          render({ ...defaultState, ...snapshot.val() });
        }, () => {
          content.className = "screen-content disconnected";
          content.textContent = "нет связи";
        });
      } catch {
        content.className = "screen-content disconnected";
        content.textContent = "настрой Firebase";
      }

      function render(state) {
        rotator.className = `rotator ${state.orientation || "landscape"}`;

        if (state.type === "color") {
          const color = colorClass[state.color] || "green";
          content.className = `screen-content color ${color}`;
          content.innerHTML = state.showWords ? `<span>${labels[state.color] || ""}</span>` : "";
          return;
        }

        if (state.type === "text") {
          content.className = "screen-content text-mode";
          content.textContent = state.customText || "";
          return;
        }

        if (state.type === "image" && state.media?.dataUrl) {
          content.className = "screen-content media-mode";
          content.innerHTML = `<img src="${state.media.dataUrl}" alt="">`;
          return;
        }

        if (state.type === "video" && state.media?.dataUrl) {
          content.className = "screen-content media-mode";
          content.innerHTML = `<video src="${state.media.dataUrl}" autoplay loop muted playsinline controls></video>`;
          return;
        }

        content.className = "screen-content blank";
        content.innerHTML = "";
      }
    </script>
  </body>
</html>
