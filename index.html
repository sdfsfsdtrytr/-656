<!doctype html>
<html lang="ru">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <title>Экран</title>
    <style>
      * {
        box-sizing: border-box;
      }

      html,
      body {
        margin: 0;
        width: 100%;
        height: 100%;
        overflow: hidden;
        font-family: Arial, Helvetica, sans-serif;
        background: #ffffff;
      }

      #screen {
        position: fixed;
        inset: 0;
        display: grid;
        place-items: center;
        background: #ffffff;
        color: #111111;
        text-align: center;
      }

      #mainText {
        padding: 6vw;
        font-size: clamp(44px, 12vw, 150px);
        font-weight: 900;
        line-height: 1.05;
        overflow-wrap: anywhere;
        white-space: pre-wrap;
      }

      img,
      video {
        width: 100%;
        height: 100%;
        object-fit: contain;
        background: #000000;
      }
    </style>
  </head>
  <body>
    <main id="screen">
      <div id="mainText"></div>
    </main>

    <script>
      const URL = "https://hhh3-635eb-default-rtdb.europe-west1.firebasedatabase.app/statusScreen/current.json";
      const screen = document.querySelector("#screen");
      let mainText = document.querySelector("#mainText");

      const words = {
        green: "не занят",
        red: "занят",
        yellow: "занят, но не сильно",
      };

      let last = "";

      showStartup();
      readNow();
      setInterval(readNow, 700);

      function showStartup() {
        ensureTextLayer();
        screen.style.background = "#ffffff";
        screen.style.color = "#111111";
        mainText.textContent = "";
      }

      async function readNow() {
        try {
          const response = await fetch(URL + "?t=" + Date.now(), { cache: "no-store" });
          if (!response.ok) throw new Error("HTTP " + response.status);
          const data = await response.json();
          const text = JSON.stringify(data || {});
          if (text === last && !isSystemState(data || {})) return;
          if (text !== last) last = text;
          render(data || {});
        } catch (error) {
          screen.style.background = "#ffffff";
          screen.style.color = "#c52020";
          mainText.textContent = "НЕТ СВЯЗИ";
        }
      }

      function render(state) {
        if (state.systemMode) {
          renderSystemMode(state);
          return;
        }

        const type = state.type || "blank";

        if (type === "color") {
          ensureTextLayer();
          if (state.color === "green") {
            screen.style.background = "#19c15f";
            screen.style.color = "#ffffff";
          } else if (state.color === "yellow") {
            screen.style.background = "#ffd333";
            screen.style.color = "#111111";
          } else if (state.color === "red") {
            screen.style.background = "#ef3939";
            screen.style.color = "#ffffff";
          } else if (state.color === "custom" && state.customColor) {
            screen.style.background = state.customColor;
            screen.style.color = readableTextColor(state.customColor);
          } else {
            screen.style.background = "#ffffff";
            screen.style.color = "#111111";
          }

          mainText.textContent = state.showWords ? words[state.color] || "" : "";
          return;
        }

        if (type === "text") {
          ensureTextLayer();
          screen.style.background = state.textBackgroundEnabled ? state.textBackgroundColor || "#ffffff" : "#ffffff";
          screen.style.color = state.textColor || "#111111";
          mainText.textContent = state.customText || "";
          return;
        }

        if (type === "image" && state.media && state.media.dataUrl) {
          screen.innerHTML = '<img src="' + state.media.dataUrl + '" alt="">';
          return;
        }

        if (type === "video" && state.media && state.media.dataUrl) {
          screen.innerHTML = '<video src="' + state.media.dataUrl + '" autoplay loop muted playsinline controls></video>';
          return;
        }

        screen.style.background = "#ffffff";
        if (state.blankColor) {
          screen.style.background = state.blankColor;
        }
        screen.style.color = "#111111";
        ensureTextLayer();
        mainText.textContent = "";
      }

      function renderSystemMode(state) {
        const started = Number(state.sequenceStartedAt || Date.now());
        const elapsed = Date.now() - started;
        const savedState = state.savedState || {};

        if (state.systemMode === "off") {
          renderShutdown(elapsed);
          return;
        }

        if (state.systemMode === "startup") {
          renderStartup(elapsed, savedState);
          return;
        }

        if (state.systemMode === "restart") {
          if (elapsed < 3000) {
            renderShutdown(elapsed);
            return;
          }
          if (elapsed < 6000) {
            showSystemMessage("", "#000000", "#ffffff");
            return;
          }
          renderStartup(elapsed - 6000, savedState);
          return;
        }

        if (state.systemMode === "maintenance") {
          showSystemMessage("Технические работы", "#000000", "#ffffff");
          return;
        }

        if (state.systemMode === "unavailable") {
          showSystemMessage("Экран временно не работает", "#000000", "#ffffff");
        }
      }

      function renderShutdown(elapsed) {
        if (elapsed < 3000) {
          const count = Math.max(1, 3 - Math.floor(elapsed / 1000));
          showSystemMessage(`Выключение экрана\n${count}`, "#000000", "#ffffff");
          return;
        }
        showSystemMessage("", "#000000", "#ffffff");
      }

      function renderStartup(elapsed, savedState) {
        if (elapsed < 1500) {
          showSystemMessage("Привет!!!", "#000000", "#ffffff");
          return;
        }
        if (elapsed < 3000) {
          showSystemMessage("Загрузка...", "#000000", "#ffffff");
          return;
        }
        if (elapsed < 5000) {
          showSystemMessage("Загрузка...", "#19c15f", "#ffffff");
          return;
        }
        if (elapsed < 7000) {
          showSystemMessage("Загрузка...", "#ffd333", "#111111");
          return;
        }
        if (elapsed < 9000) {
          showSystemMessage("Загрузка...", "#ef3939", "#ffffff");
          return;
        }
        if (elapsed < 11000) {
          showSystemMessage("Успешно", "#000000", "#19c15f");
          return;
        }
        render(savedState);
      }

      function showSystemMessage(text, background, color) {
        ensureTextLayer();
        screen.style.background = background;
        screen.style.color = color;
        mainText.textContent = text;
      }

      function isSystemState(state) {
        return ["off", "startup", "restart", "maintenance", "unavailable"].includes(state.systemMode);
      }

      function ensureTextLayer() {
        if (document.querySelector("#mainText")) {
          mainText = document.querySelector("#mainText");
          return;
        }
        screen.innerHTML = '<div id="mainText"></div>';
        mainText = document.querySelector("#mainText");
      }

      function readableTextColor(hex) {
        const clean = String(hex || "").replace("#", "");
        if (clean.length !== 6) return "#ffffff";
        const r = parseInt(clean.slice(0, 2), 16);
        const g = parseInt(clean.slice(2, 4), 16);
        const b = parseInt(clean.slice(4, 6), 16);
        const brightness = (r * 299 + g * 587 + b * 114) / 1000;
        return brightness > 150 ? "#111111" : "#ffffff";
      }
    </script>
  </body>
</html>
