<!doctype html>
<html lang="ru">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <title>Экран</title>
    <style>
      * {
        box-sizing: border-box;
      }

      html,
      body {
        margin: 0;
        width: 100%;
        height: 100%;
        overflow: hidden;
        font-family: Arial, Helvetica, sans-serif;
        background: #ffffff;
      }

      #screen {
        position: fixed;
        inset: 0;
        display: grid;
        place-items: center;
        background: #ffffff;
        color: #111111;
        text-align: center;
      }

      #mainText {
        padding: 6vw;
        font-size: clamp(44px, 12vw, 150px);
        font-weight: 900;
        line-height: 1.05;
        overflow-wrap: anywhere;
        white-space: pre-wrap;
      }

      img,
      video {
        width: 100%;
        height: 100%;
        object-fit: contain;
        background: #000000;
      }

      .admin-box {
        width: min(720px, calc(100vw - 32px));
        display: grid;
        gap: 16px;
        padding: 22px;
      }

      .admin-box h1 {
        margin: 0;
        font-size: clamp(36px, 8vw, 84px);
      }

      .admin-box input,
      .admin-box button {
        min-height: 52px;
        border: 1px solid #333333;
        border-radius: 8px;
        padding: 12px 14px;
        font: inherit;
        font-size: 20px;
      }

      .admin-box button {
        background: #ffffff;
        color: #111111;
        font-weight: 800;
      }

      .admin-grid {
        display: grid;
        grid-template-columns: repeat(2, minmax(0, 1fr));
        gap: 10px;
      }

      .progress-wrap {
        width: min(860px, calc(100vw - 48px));
        display: grid;
        gap: 18px;
      }

      .progress-row {
        display: grid;
        grid-template-columns: 76px 1fr;
        align-items: center;
        gap: 14px;
        font-size: clamp(24px, 5vw, 54px);
        font-weight: 900;
      }

      .progress-track {
        height: 26px;
        overflow: hidden;
        border: 2px solid #ffffff;
        border-radius: 999px;
        background-color: transparent;
      }

      .progress-fill {
        height: 100%;
        width: 0%;
        background: #ffffff;
      }

      @media (max-width: 620px) {
        .admin-grid {
          grid-template-columns: 1fr;
        }
      }
    </style>
  </head>
  <body>
    <main id="screen">
      <div id="mainText"></div>
    </main>

    <script>
      const URL = "https://hhh3-635eb-default-rtdb.europe-west1.firebasedatabase.app/statusScreen/current.json";
      const ADMIN_PASSWORD = "1234";
      const screen = document.querySelector("#screen");
      let mainText = document.querySelector("#mainText");

      const words = {
        green: "не занят",
        red: "занят",
        yellow: "занят, но не сильно",
      };

      let last = "";
      let latestState = {};
      let pageBootStart = Date.now();
      let pageBooting = true;
      let updateFinished = false;

      showStartup();
      readNow();
      setInterval(readNow, 700);
      setInterval(renderPageBoot, 250);
      sendHeartbeat();
      setInterval(sendHeartbeat, 3000);

      function showStartup() {
        ensureTextLayer();
        screen.style.background = "#ffffff";
        screen.style.color = "#111111";
        mainText.textContent = "";
      }

      async function readNow() {
        try {
          const response = await fetch(URL + "?t=" + Date.now(), { cache: "no-store" });
          if (!response.ok) throw new Error("HTTP " + response.status);
          const data = await response.json();
          latestState = data || {};
          if (pageBooting) {
            renderPageBoot();
            return;
          }
          const text = JSON.stringify(data || {});
          if (text === last && !needsContinuousRender(data || {})) return;
          if (text !== last) last = text;
          render(data || {});
        } catch (error) {
          screen.style.background = "#ffffff";
          screen.style.color = "#c52020";
          mainText.textContent = "НЕТ СВЯЗИ";
        }
      }

      function renderPageBoot() {
        if (!pageBooting) return;
        const elapsed = Date.now() - pageBootStart;
        if (elapsed < 11000) {
          renderStartup(elapsed, latestState);
          return;
        }
        pageBooting = false;
        last = "";
        render(latestState || {});
      }

      function render(state) {
        if (state.systemMode) {
          renderSystemMode(state);
          return;
        }

        const type = state.type || "blank";

        if (type === "color") {
          ensureTextLayer();
          if (state.color === "green") {
            screen.style.background = "#19c15f";
            screen.style.color = "#ffffff";
          } else if (state.color === "yellow") {
            screen.style.background = "#ffd333";
            screen.style.color = "#111111";
          } else if (state.color === "red") {
            screen.style.background = "#ef3939";
            screen.style.color = "#ffffff";
          } else if (state.color === "custom" && state.customColor) {
            screen.style.background = state.customColor;
            screen.style.color = readableTextColor(state.customColor);
          } else {
            screen.style.background = "#ffffff";
            screen.style.color = "#111111";
          }

          mainText.textContent = state.showWords ? words[state.color] || "" : "";
          return;
        }

        if (type === "text") {
          ensureTextLayer();
          screen.style.background = state.textBackgroundEnabled ? state.textBackgroundColor || "#ffffff" : "#ffffff";
          screen.style.color = state.textColor || "#111111";
          mainText.textContent = state.customText || "";
          return;
        }

        if (type === "image" && state.media && state.media.dataUrl) {
          screen.innerHTML = '<img src="' + state.media.dataUrl + '" alt="">';
          return;
        }

        if (type === "video" && state.media && state.media.dataUrl) {
          screen.innerHTML = '<video src="' + state.media.dataUrl + '" autoplay loop muted playsinline controls></video>';
          return;
        }

        screen.style.background = "#ffffff";
        if (state.blankColor) {
          screen.style.background = state.blankColor;
        }
        screen.style.color = "#111111";
        ensureTextLayer();
        mainText.textContent = "";
      }

      function renderSystemMode(state) {
        const started = Number(state.sequenceStartedAt || Date.now());
        const elapsed = Date.now() - started;
        const savedState = state.savedState || {};

        if (state.systemMode === "off") {
          renderShutdown(elapsed);
          return;
        }

        if (state.systemMode === "startup") {
          renderStartup(elapsed, savedState);
          return;
        }

        if (state.systemMode === "restart") {
          if (elapsed < 3000) {
            renderShutdown(elapsed);
            return;
          }
          if (elapsed < 6000) {
            showSystemMessage("", "#000000", "#ffffff");
            return;
          }
          renderStartup(elapsed - 6000, savedState);
          return;
        }

        if (state.systemMode === "maintenance") {
          showSystemMessage("Технические работы", "#000000", "#ffffff");
          return;
        }

        if (state.systemMode === "unavailable") {
          showSystemMessage("Экран временно не работает", "#000000", "#ffffff");
          return;
        }

        if (state.systemMode === "admin-login") {
          renderAdminLogin(state);
          return;
        }

        if (state.systemMode === "admin-denied") {
          showSystemMessage("Запрос был отклонён", "#000000", "#ffffff");
          return;
        }

        if (state.systemMode === "admin-panel") {
          renderAdminPanel(state);
          return;
        }

        if (state.systemMode === "update") {
          renderUpdate(elapsed, state);
        }
      }

      function renderShutdown(elapsed) {
        if (elapsed < 3000) {
          const count = Math.max(1, 3 - Math.floor(elapsed / 1000));
          showSystemMessage(`Выключение экрана\n${count}`, "#000000", "#ffffff");
          return;
        }
        showSystemMessage("", "#000000", "#ffffff");
      }

      function renderStartup(elapsed, savedState) {
        if (elapsed < 1500) {
          showSystemMessage("Привет!!!", "#000000", "#ffffff");
          return;
        }
        if (elapsed < 3000) {
          showSystemMessage("Загрузка...", "#000000", "#ffffff");
          return;
        }
        if (elapsed < 5000) {
          showSystemMessage("Загрузка...", "#19c15f", "#ffffff");
          return;
        }
        if (elapsed < 7000) {
          showSystemMessage("Загрузка...", "#ffd333", "#111111");
          return;
        }
        if (elapsed < 9000) {
          showSystemMessage("Загрузка...", "#ef3939", "#ffffff");
          return;
        }
        if (elapsed < 11000) {
          showSystemMessage("Успешно", "#000000", "#19c15f");
          return;
        }
        render(savedState);
      }

      function showSystemMessage(text, background, color) {
        ensureTextLayer();
        screen.style.background = background;
        screen.style.color = color;
        mainText.textContent = text;
      }

      function isSystemState(state) {
        return ["off", "startup", "restart", "maintenance", "unavailable", "admin-login", "admin-denied", "admin-panel", "update"].includes(state.systemMode);
      }

      function needsContinuousRender(state) {
        return ["off", "startup", "restart", "update"].includes(state.systemMode);
      }

      function renderAdminLogin(state) {
        if (state.adminRequestStatus === "pending") {
          showSystemMessage("Ожидаем ответа", "#000000", "#ffffff");
          return;
        }

        screen.style.background = "#000000";
        screen.style.color = "#ffffff";
        screen.innerHTML = `
          <form id="adminLoginForm" class="admin-box">
            <h1>Введите пароль</h1>
            <input id="adminPasswordInput" type="password" inputmode="numeric" autocomplete="off" aria-label="Пароль">
            <button type="submit">Войти</button>
          </form>
        `;
        const form = document.querySelector("#adminLoginForm");
        const input = document.querySelector("#adminPasswordInput");
        input.focus();
        form.addEventListener("submit", (event) => {
          event.preventDefault();
          if (input.value.replace(/\D/g, "") !== ADMIN_PASSWORD) {
            input.value = "";
            input.placeholder = "Неверный пароль";
            return;
          }
          updateFirebase({ ...state, adminRequestStatus: "pending", updatedAt: Date.now() });
          showSystemMessage("Ожидаем ответа", "#000000", "#ffffff");
        });
      }

      function renderAdminPanel(state) {
        screen.style.background = "#000000";
        screen.style.color = "#ffffff";
        screen.innerHTML = `
          <section class="admin-box">
            <h1>Админ-панель</h1>
            <div class="admin-grid">
              <button data-admin="off" type="button">Выключить экран</button>
              <button data-admin="restart" type="button">Перезагрузить</button>
              <button data-admin="maintenance" type="button">Технические работы</button>
              <button data-admin="unavailable" type="button">Временно не работает</button>
              <button data-admin="update" type="button">Обновить</button>
              <button data-admin="exit" type="button">Выйти из админ-панели</button>
            </div>
          </section>
        `;
        document.querySelectorAll("[data-admin]").forEach((button) => {
          button.addEventListener("click", () => handleAdminAction(button.dataset.admin, state));
        });
      }

      function handleAdminAction(action, state) {
        const savedState = state.savedState || {};
        if (action === "exit") {
          updateFirebase({ ...savedState, systemMode: null, savedState: null, adminRequestStatus: null, sequenceStartedAt: null, updatedAt: Date.now() });
          return;
        }
        if (action === "off") {
          updateFirebase({ ...savedState, systemMode: "off", savedState, sequenceStartedAt: Date.now(), updatedAt: Date.now() });
          return;
        }
        if (action === "restart") {
          updateFirebase({ ...savedState, systemMode: "restart", savedState, sequenceStartedAt: Date.now(), updatedAt: Date.now() });
          return;
        }
        if (action === "maintenance") {
          updateFirebase({ ...savedState, systemMode: "maintenance", savedState, sequenceStartedAt: Date.now(), updatedAt: Date.now() });
          return;
        }
        if (action === "unavailable") {
          updateFirebase({ ...savedState, systemMode: "unavailable", savedState, sequenceStartedAt: Date.now(), updatedAt: Date.now() });
          return;
        }
        if (action === "update") {
          updateFirebase({ ...savedState, systemMode: "update", savedState, sequenceStartedAt: Date.now(), updatedAt: Date.now() });
        }
      }

      function renderUpdate(elapsed, state) {
        if (elapsed < 2000) {
          showSystemMessage("Обновление экрана", "#000000", "#ffffff");
          return;
        }
        if (elapsed < 62000) {
          renderProgress("Загрузка обновления...", elapsed - 2000, 60000);
          return;
        }
        if (elapsed < 65000) {
          renderProgress("Загрузка обновления...", 60000, 60000);
          return;
        }
        if (elapsed < 68000) {
          renderShutdown(elapsed - 65000);
          return;
        }
        if (elapsed < 71000) {
          showSystemMessage("", "#000000", "#ffffff");
          return;
        }
        if (elapsed < 131000) {
          renderProgress("Установка обновления", elapsed - 71000, 60000);
          return;
        }
        if (elapsed < 133000) {
          showSystemMessage("Обновление прошло успешно!!!", "#000000", "#19c15f");
          return;
        }
        if (updateFinished) return;
        updateFinished = true;
        const savedState = state.savedState || {};
        updateFirebase({ ...savedState, systemMode: null, savedState: null, sequenceStartedAt: null, updatedAt: Date.now() })
          .finally(() => window.location.reload());
      }

      function renderProgress(title, elapsed, duration) {
        const percent = Math.min(100, Math.max(0, Math.floor((elapsed / duration) * 100)));
        screen.style.background = "#000000";
        screen.style.color = "#ffffff";
        screen.innerHTML = `
          <section class="progress-wrap">
            <div id="mainText">${title}</div>
            <div class="progress-row">
              <div>${percent}%</div>
              <div class="progress-track" style="background: linear-gradient(to right, #ffffff 0%, #ffffff ${percent}%, transparent ${percent}%, transparent 100%);"><div class="progress-fill" style="width: ${percent}%; background: #ffffff !important;"></div></div>
            </div>
          </section>
        `;
        mainText = document.querySelector("#mainText");
      }

      function sendHeartbeat() {
        fetch(URL, {
          method: "PATCH",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ screenOnlineAt: Date.now() }),
        }).catch(() => {});
      }

      function updateFirebase(nextState) {
        return fetch(URL, {
          method: "PUT",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify(nextState),
        });
      }

      function ensureTextLayer() {
        if (document.querySelector("#mainText")) {
          mainText = document.querySelector("#mainText");
          return;
        }
        screen.innerHTML = '<div id="mainText"></div>';
        mainText = document.querySelector("#mainText");
      }

      function readableTextColor(hex) {
        const clean = String(hex || "").replace("#", "");
        if (clean.length !== 6) return "#ffffff";
        const r = parseInt(clean.slice(0, 2), 16);
        const g = parseInt(clean.slice(2, 4), 16);
        const b = parseInt(clean.slice(4, 6), 16);
        const brightness = (r * 299 + g * 587 + b * 114) / 1000;
        return brightness > 150 ? "#111111" : "#ffffff";
      }
    </script>
  </body>
</html>
